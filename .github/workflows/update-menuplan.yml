name: Update Menuplan

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Download PDF
        run: |
          wget -O menuplan.pdf "https://www.solothurnerspitaeler.ch/fileadmin/Menueplaene/Aktueller_Menuplan_Buergerspital_Solothurn.pdf"

      - name: Convert first page to PNG
        run: |
          pdftoppm -png -f 1 -singlefile menuplan.pdf menuplan

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add menuplan.png
          git commit -m "Update menuplan" || exit 0
          git push
